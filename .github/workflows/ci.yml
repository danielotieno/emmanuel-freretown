name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; Dependabot keeps them current.
jobs:
  check:
    name: Types, lint, rules, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same major version as Neon (database-design.md). Runs on the GitHub runner only.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ack_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:deps
      - run: pnpm format:check
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git diff --exit-code -- src/db/migrations || (echo "Schema changed without a committed migration. Run pnpm db:generate." && exit 1)
      - run: pnpm test
      - run: pnpm test:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # The registration journey (#16) stores registrations, so it needs a migrated database.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ack_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ack_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Migrate the e2e database and connect the app as its login
        run: |
          pnpm db:migrate
          url="$(pnpm -s db:app-login)"
          echo "::add-mask::$url"
          echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=$url" >> "$GITHUB_ENV"
      - name: Test-mode settings (no SMS; code 000000; Cloudflare's always-pass Turnstile keys)
        run: |
          {
            echo "E2E_TEST_MODE=1"
            echo "OTP_SECRET=ci-e2e-otp-secret-$(openssl rand -hex 16)"
            echo "RATE_LIMIT_SECRET=ci-e2e-rate-limit-secret-$(openssl rand -hex 16)"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
          } > .dev.vars
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  worker:
    name: Cloudflare Worker build and smoke test (workerd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The smoke test fires the daily Cron Trigger, whose jobs need a migrated database (#10).
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ack_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ack_smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:i18n && pnpm exec opennextjs-cloudflare build
      - name: Migrate the smoke database and connect the Worker as the app's login
        run: |
          pnpm db:migrate
          url="$(pnpm -s db:app-login)"
          echo "::add-mask::$url"
          echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=$url" >> "$GITHUB_ENV"
      - run: pnpm smoke:worker
