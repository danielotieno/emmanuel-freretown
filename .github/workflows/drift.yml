name: Schema drift check

# Issue #8 (ADR 0003). Weekly, compares staging and production with a database built here from
# the committed migrations: tables, columns, CHECK and exclusion constraints, indexes,
# functions, triggers, grants and applied migrations (scripts/db-drift.ts). Reads definitions
# only, as the read-only ack_backup login. A failed run means someone changed a live database
# outside the migrations, or a migration was not applied; GitHub emails the failure.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 06:00 in Nairobi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Drift in ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ack_expected
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPECTED_URL: postgres://postgres:postgres@localhost:5432/ack_expected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the reference database from the migrations
        run: DATABASE_URL="$EXPECTED_URL" pnpm db:migrate
      - name: Compare with ${{ matrix.environment }}
        env:
          DRIFT_EXPECTED_URL: ${{ env.EXPECTED_URL }}
          DRIFT_ACTUAL_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: pnpm db:drift
