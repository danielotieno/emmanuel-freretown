name: Feature or task
description: A unit of work, delivered as one pull request
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed. Link requirement IDs (BR-, FR-, NFR-) and documents.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes, including tests.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      description: Issues that must be done first.
