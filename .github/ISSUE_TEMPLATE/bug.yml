name: Bug
description: Something does not work as specified
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Never paste members' names, phone numbers or FWO numbers into an issue.** Use registration references (REG-…) or synthetic data."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Environment (production, staging, local), page, language, device.
    validations:
      required: true
