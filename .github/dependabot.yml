# Next.js and React security releases are applied within 48 hours (ADR 0001).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing new versions (security updates are not delayed).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
